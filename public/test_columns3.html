<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 0; background: #f3f4f6; height: 100vh; display: flex; flex-direction: column; }
  .scroll-container {
    flex: 1;
    writing-mode: vertical-rl;
    overflow: auto;
    padding-top: 50px;
    padding-bottom: 50px;
    padding-right: 50px; /* Initial padding */
    /* Draw pages: white paper, then gap */
    background: repeating-linear-gradient(
      to left,
      white 0,
      white 210mm,
      #f3f4f6 210mm,
      #f3f4f6 calc(210mm + 40px)
    );
    /* Make background start after padding-right! */
    background-position: right 50px top 0;
  }
  .editor {
    writing-mode: vertical-rl;
    height: 297mm;
    width: 210mm; /* Force break */
    column-width: 297mm; /* Column height */
    column-gap: 40px;
    outline: none;
    font-size: 16px;
    line-height: 1.8;
  }
</style>
</head>
<body>
  <div class="scroll-container">
    <div class="editor" contenteditable="true">
      あいうえお。<br>
      かきくけこ。<br>
      <script>
        for(let i=0; i<50; i++) {
          document.write('あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん。');
        }
      </script>
    </div>
  </div>
</body>
</html>

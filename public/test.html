<!DOCTYPE html>
<html lang="ja">
<head>

<style>
  body { display: flex; height: 100vh; margin: 0; }
  .editor {
    writing-mode: vertical-rl;
    height: 500px;
    column-width: 200px;
    column-gap: 50px;
    background: pink;
  }
</style>
</head>
<body>
  <div class="editor" contenteditable="true">
    <script>
      for(let i=0; i<100; i++) {
        document.write('あいうえおかきくけこ');
      }
    </script>
  </div>
</body>
</html>

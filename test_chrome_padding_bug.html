<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; height: 100vh; }
  .strip {
    height: 500px;
    background: white;
    width: max-content;
    min-width: 1000px;
    display: block;
    text-align: right;
    padding-right: 50px; /* Does this compress the child? */
  }
  .editor {
    writing-mode: vertical-rl;
    height: 100%;
    direction: ltr;
    display: inline-block;
    text-align: left;
    background: yellow;
  }
</style>
</head>
<body>
  <div class="strip">
    <div class="editor" id="ed" contenteditable="true"></div>
  </div>
  <script>
    const ed = document.getElementById('ed');
    let text = '';
    for(let i=0; i<100; i++) text += 'あいうえお<br>かきくけこ<br>';
    ed.innerHTML = text;
  </script>
</body>
</html>

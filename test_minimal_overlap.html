<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; height: 100vh; justify-content: flex-end; background: #ccc; }
  .editor-wrapper {
    /* Using float or right-alignment? */
    direction: rtl; /* This makes the scrollbar work and grow left */
    overflow-x: auto;
    width: 100%;
    display: flex;
  }
  .editor {
    writing-mode: vertical-rl;
    height: 500px;
    background: white;
    padding: 50px;
    font-size: 20px;
    line-height: 2;
    outline: none;
    direction: ltr; /* Text itself reads right-to-left correctly */
  }
</style>
</head>
<body>
  <div class="editor-wrapper">
    <div class="editor" id="ed" contenteditable="true">
      あいうえお<br>かきくけこ
    </div>
  </div>
  <script>
    setTimeout(() => {
      const ed = document.getElementById('ed');
      ed.focus();
      let text = '';
      for(let i=0; i<100; i++) text += 'あいうえお<br>かきくけこ<br>';
      ed.innerHTML = text;
    }, 500);
  </script>
</body>
</html>

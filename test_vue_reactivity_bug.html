<!DOCTYPE html>
<html>
<head>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
  body { margin: 0; display: flex; height: 100vh; }
  .scrollContainer {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    display: flex;
    align-items: center;
    background: #ccc;
    direction: rtl;
  }
  .flex-col-wrapper {
    display: flex;
    flex-direction: column;
    min-width: max-content;
    padding: 50px;
    direction: ltr;
  }
  .strip {
    height: 500px;
    background: white;
    width: max-content;
    position: relative;
    display: block;
  }
  .editor {
    writing-mode: vertical-rl;
    height: 400px;
    direction: ltr;
    position: absolute;
    right: 20px;
    top: 20px;
    outline: 1px solid red;
    font-size: 16px;
    line-height: 1.8;
  }
</style>
</head>
<body>
  <div id="app">
    <div class="scrollContainer" id="scroll">
      <div class="flex-col-wrapper">
        <div class="strip" :style="{ minWidth: stripMinWidth + 'px' }">
          <div class="editor" contenteditable="true" @input="onInput">
            あいうえお<br>かきくけこ
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue

    createApp({
      setup() {
        const stripMinWidth = ref(1000)
        let w = 1000;
        const onInput = (e) => {
          // Simulate ResizeObserver expanding the parent
          if (e.target.scrollWidth > w - 100) {
            w += 1000;
            stripMinWidth.value = w;
          }
        }

        return {
          stripMinWidth,
          onInput
        }
      }
    }).mount('#app')
  </script>
</body>
</html>

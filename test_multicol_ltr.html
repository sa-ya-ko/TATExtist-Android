<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; height: 100vh; background: #ccc; }
  .scrollContainer {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    background: #ccc;
    direction: rtl; /* RTL scroll */
  }
  .strip {
    height: 500px;
    background: white;
    padding: 50px;
    direction: ltr; /* LTR wrapper! */
    width: max-content;
    display: block;
  }
  .editor {
    writing-mode: vertical-rl;
    height: 400px;
    direction: ltr;
    font-size: 20px;
    line-height: 1.8;
    column-width: 300px;
    column-gap: 100px;
    /* Can we use right-alignment here? No, if we use dir="ltr", multi-column vertical-rl grows to the LEFT! */
  }
</style>
</head>
<body>
  <div class="scrollContainer" id="scroll">
    <div class="strip">
      <div class="editor" id="ed" contenteditable="true">
      </div>
    </div>
  </div>

  <script>
    setTimeout(() => {
      const ed = document.getElementById('ed');
      let text = '';
      for(let i=0; i<30; i++) text += i + 'あいうえお<br>かきくけこ<br>';
      ed.innerHTML = text;
    }, 500);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; height: 100vh; }
  .scrollContainer {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    display: flex;
    align-items: center;
    background: #ccc;
    direction: rtl; /* RTL scroll */
  }
  .flex-col-wrapper {
    display: flex;
    flex-direction: column;
    min-width: max-content;
    padding: 50px;
    direction: ltr; /* Reset to LTR for the children! */
  }
  .strip {
    height: 500px;
    background: white;
    width: max-content;
    min-width: 1000px;
    display: block;
    text-align: right;
  }
  .editor {
    writing-mode: vertical-rl;
    height: 100%;
    direction: ltr;
    display: inline-block;
    text-align: left;
    outline: 2px solid red; /* To see its bounds */
  }
</style>
</head>
<body>
  <div class="scrollContainer" id="scroll">
    <div class="flex-col-wrapper">
      <div class="strip" id="strip">
        <div class="editor" id="ed" contenteditable="true">
          あいうえお<br>かきくけこ
        </div>
      </div>
    </div>
  </div>
  <script>
    setTimeout(() => {
      // Simulate typing a lot of text
      const ed = document.getElementById('ed');
      let text = '';
      for(let i=0; i<100; i++) text += 'あいうえお<br>かきくけこ<br>';
      ed.innerHTML = text;
      
      // Simulate Vue updating min-width AFTER reading scrollWidth
      const strip = document.getElementById('strip');
      strip.style.minWidth = Math.max(1000, ed.scrollWidth) + "px";
    }, 1000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 50px; background: #eee; }
  .editor {
    writing-mode: vertical-rl;
    height: 400px;
    background: white;
    font-size: 20px;
    line-height: 2;
  }
</style>
</head>
<body>
  <button onclick="document.execCommand('indent', false, null)">Indent</button>
  <div class="editor" contenteditable="true" id="ed">
    <p>段落を選択してインデントします。</p>
  </div>
  <script>
    // select text
    const ed = document.getElementById('ed');
    const range = document.createRange();
    range.selectNodeContents(ed.querySelector('p'));
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    setTimeout(() => {
      document.execCommand('indent', false, null);
      console.log(ed.innerHTML);
    }, 500);
  </script>
</body>
</html>

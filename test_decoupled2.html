<!DOCTYPE html>
<html>
<head>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
  body { margin: 0; display: flex; height: 100vh; background: #333; }
  .scrollContainer {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    background: #ccc;
    direction: rtl; /* RTL scroll */
    position: relative;
    display: flex;
    align-items: center;
  }
  .content-wrapper {
    display: block;
    height: 500px;
    min-width: max-content;
    position: relative;
    direction: rtl; /* Force child to grow left */
  }
  .background-pages {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    /* Simulate repeating pages */
    background: repeating-linear-gradient(to left, white, white 390px, #eee 390px, #eee 400px);
    z-index: 1;
  }
  .editor {
    writing-mode: vertical-rl;
    height: 500px;
    direction: ltr;
    position: relative;
    z-index: 2;
    padding: 50px;
    font-size: 16px;
    line-height: 1.8;
    outline: none;
    background: transparent;
  }
</style>
</head>
<body>
  <div id="app">
    <div class="scrollContainer" id="scroll">
      <div class="content-wrapper">
        <div class="background-pages" :style="{ width: totalWidth + 'px' }"></div>
        <div class="editor" contenteditable="true" @input="onInput">
          あいうえお<br>かきくけこ
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue

    createApp({
      setup() {
        const totalWidth = ref(400)
        let w = 400;
        const onInput = (e) => {
          if (e.target.scrollWidth > w - 100) {
            w += 400;
            totalWidth.value = w;
          }
        }

        return {
          totalWidth,
          onInput
        }
      }
    }).mount('#app')
  </script>
</body>
</html>

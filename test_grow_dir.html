<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; height: 100vh; }
  .scrollContainer {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    background: #ccc;
    direction: rtl; /* RTL scroll */
  }
  .content-wrapper {
    min-width: max-content;
    height: 100%;
    padding: 50px;
    direction: ltr; /* Reset to LTR */
    background: pink;
    display: flex;
    justify-content: flex-end; /* Push to right */
  }
  .editor {
    writing-mode: vertical-rl;
    height: 100%;
    background: yellow;
  }
</style>
</head>
<body>
  <div class="scrollContainer" id="scroll">
    <div class="content-wrapper">
      <div class="editor" id="ed" contenteditable="true">
        あいうえお
      </div>
    </div>
  </div>
  <script>
    setTimeout(() => {
      const ed = document.getElementById('ed');
      let text = '';
      for(let i=0; i<100; i++) text += 'あいうえお<br>かきくけこ<br>';
      ed.innerHTML = text;
    }, 500);
  </script>
</body>
</html>

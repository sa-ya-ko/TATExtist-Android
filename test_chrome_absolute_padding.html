<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; height: 100vh; }
  .strip {
    height: 500px;
    background: #eee;
    min-width: 1000px;
    padding: 50px;
    box-sizing: border-box; /* usually implicitly handled or explicit */
  }
  .content-area {
    position: relative;
    width: 100%;
    height: 100%;
    background: white;
  }
  .editor {
    writing-mode: vertical-rl;
    height: 100%;
    direction: ltr;
    position: absolute;
    right: 0;
    top: 0;
    background: yellow;
  }
</style>
</head>
<body>
  <div class="strip" id="strip">
    <div class="content-area">
      <div class="editor" id="ed" contenteditable="true"></div>
    </div>
  </div>
  <script>
    setTimeout(() => {
      const ed = document.getElementById('ed');
      let text = '';
      for(let i=0; i<100; i++) text += 'あいうえお<br>かきくけこ<br>';
      ed.innerHTML = text;
      
      setTimeout(() => {
        document.getElementById('strip').style.minWidth = "2000px";
      }, 500);
    }, 500);
  </script>
</body>
</html>
